# Cloudflare Worker settings for the VTube Collab room server.
# Deploy: `npx wrangler deploy` (from this folder). Local test: `npx wrangler dev`.
# Runs on the Workers Free plan: when the daily free limit is used up, requests
# fail until midnight UTC — nothing is charged.

name = "vtube-collab"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Each room is a Durable Object of class "RoomV2", reachable from the code as env.ROOMS2.
[[durable_objects.bindings]]
name = "ROOMS2"
class_name = "RoomV2"

# Storage history (Cloudflare needs every step kept, in order).
# Free plan: Durable Objects must use the SQLite storage backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]       # first room server (one-time mailbox)

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RoomV2"]     # rooms for 2–100 people

[[migrations]]
tag = "v3"
deleted_classes = ["Room"]          # first room server removed (no longer used)

# Per-IP limits (free): one internet connection can open at most 5 rooms and make
# 30 room connections (joins and reconnects) a minute. Protects the daily allowance
# from someone opening rooms in a loop. Over the limit → "wait a minute" (HTTP 503).
[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
