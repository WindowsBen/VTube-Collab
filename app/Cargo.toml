[package]
name = "app"
version = "0.4.0-beta"
license = "MIT"
edition = "2024"

# The program is called VTubeCollab.exe.
[[bin]]
name = "VTubeCollab"
path = "src/main.rs"

[dependencies]
collab = { path = "../collab" }
eframe = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
vtc-core = { path = "../vtc-core" }

[build-dependencies]
png = "0.18.1"
winresource = "0.1.34"
